name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Must match the committed library version
        required: true
        type: string
        default: 0.1.0-beta.4
      tag:
        description: Must match committed publishConfig (beta uses next)
        required: true
        type: choice
        options: [next, latest]
        default: next
      dry_run:
        description: Verify and retain artifacts without publishing
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

env:
  EXPECTED_VERSION: ${{ inputs.expected_version }}
  NPM_TAG: ${{ inputs.tag }}
  RELEASE_DRY_RUN: ${{ inputs.dry_run }}
  NPM_RELEASE_ENABLED: ${{ vars.NPM_RELEASE_ENABLED }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      integrity: ${{ steps.prepare.outputs.integrity }}
    env:
      CI: 'true'
      CHARA_LIVE_SMOKE: '0'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Check dispatch, committed metadata and registry availability
        run: node --experimental-strip-types scripts/release.ts preflight
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.27.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm type-check
      - run: pnpm lint
      - run: pnpm verify-fixtures
      - run: pnpm verify-palettes
      - run: pnpm test
      - run: pnpm audit
      - name: Build and verify the final tarball in installed runtimes
        run: pnpm test:package
      - name: Record integrity of the checked bytes
        id: prepare
        run: node --experimental-strip-types scripts/release.ts prepare
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: npm-candidate
          path: |
            ${{ steps.prepare.outputs.tarball }}
            .superpowers/package-smoke/release.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: verify
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          path: .superpowers/release-candidate
          merge-multiple: true
      - name: Install pinned npm CLI with trusted publishing support
        run: npm install --global npm@11.21.0 --ignore-scripts
      - name: Verify candidate handoff and recheck version availability
        id: candidate
        env:
          RELEASE_INTEGRITY: ${{ needs.verify.outputs.integrity }}
        run: node --experimental-strip-types scripts/release.ts verify
      - name: Publish the exact checked tarball with OIDC
        env:
          CANDIDATE_PATH: ${{ steps.candidate.outputs.tarball }}
        run: npm publish "$CANDIDATE_PATH" --ignore-scripts --registry=https://registry.npmjs.org --access public --tag "$NPM_TAG" --provenance
